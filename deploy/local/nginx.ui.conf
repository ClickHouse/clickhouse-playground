# UI nginx for the local deploy: serves the static app and proxies /api/ to the backend so
# the browser talks to the API same-origin (works regardless of which host the browser is on).
server {
    listen 80;

    location /api/ {
        # Resolve the backend lazily via Docker's embedded DNS so nginx starts even when the
        # backend is not up yet (returns 502 until ready instead of failing at config parse).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend;
        proxy_pass http://$backend:9000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Query runs can take up to the backend's server_timeout (60s); allow some headroom.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
