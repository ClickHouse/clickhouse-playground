name: Push UI Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Push UI Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lodthe/clickhouse-playground-ui
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          platforms: linux/amd64
          tags: lodthe/clickhouse-playground-ui:latest,${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_URL=https://fiddle.clickhouse.com/api/
          cache-from: type=gha
          cache-to: type=gha,mode=max
